<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HIERO 게스트 가이드북</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendard-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --cream:#FBF7EE; --paper:#FFFDF8; --tan:#F7ECE9; --tan2:#F7ECE9;
    --ink:#1E1A14; --sub:#8a807e; --line:#C0342A; --hair:#E6DDCB;
    --brand:#C0342A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scroll-behavior:smooth; }   /* 하단 탭 → 섹션으로 슬라이드 이동 */
  body{ margin:0; background:var(--brand); color:var(--ink);
        font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif; }
  .serif{ font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif; }
  .wrap{ max-width:520px; margin:0 auto; background:#ffffff; min-height:100vh; }
  .caps{ letter-spacing:.22em; text-transform:uppercase; }

  /* 상단 흰 헤더바 */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:15px 20px;
           background:#fff; border-bottom:2px solid var(--brand); }
  .topbar .logo{ height:34px; width:auto; }
  .langs{ display:flex; gap:6px; }
  .langbtn{ border:1.5px solid var(--brand); background:#fff; color:var(--brand); font-size:12px; font-weight:800;
            padding:6px 11px; border-radius:999px; cursor:pointer; }
  .langbtn.on{ background:var(--brand); color:#fff; }
  /* 숙소 사진 */
  .hero{ position:relative; height:270px; overflow:hidden;
         background:linear-gradient(135deg,#2b3a3d,#4a5c5f); }
  .hero > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
  .hero .langs{ position:absolute; top:14px; right:14px; z-index:3; }
  .hero .langbtn{ box-shadow:0 1px 4px rgba(0,0,0,.15); }

  .content{ padding:26px 36px 96px; }
  .welcome{ text-align:center; margin-bottom:22px; }
  .wsym{ height:28px; width:auto; display:block; margin:0 auto 4px; }
  .eyebrow{ font-size:11px; color:var(--sub); font-weight:700; }
  .title{ font-size:34px; font-weight:700; margin:6px 0 8px; line-height:1.1; }
  .host{ font-size:10.5px; color:var(--sub); font-weight:700; }

  .infoCard{ background:var(--tan); border:1.5px solid var(--brand); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .infoCard.split{ display:flex; align-items:stretch; padding:0; }
  .infoCard.split > div{ flex:1; padding:16px 18px; }
  .infoCard.split > .divider{ flex:0 0 1px; background:rgba(168,50,45,.4); margin:14px 0; padding:0; }
  .lbl{ display:block; font-size:10px; color:var(--sub); font-weight:800; letter-spacing:.12em; }
  .val{ display:block; font-size:19px; font-weight:600; margin-top:3px; }
  .infoCard .val.sm{ font-size:16px; }
  .infoCard .row + .row{ margin-top:12px; }

  /* 하단 고정 탭바 (바바 피드백 — 모바일에서 화면 하단 고정) */
  .menu{ position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:520px;
         display:flex; flex-direction:row; gap:0; background:#fff; border-top:1.5px solid var(--brand);
         box-shadow:0 -3px 14px rgba(0,0,0,.10); z-index:2000;
         padding:7px 4px calc(7px + env(safe-area-inset-bottom)); }
  .pill{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
         text-decoration:none; color:var(--brand); border:none; border-radius:12px; padding:5px 2px;
         font-size:10.5px; font-weight:700; transition:background .15s; }
  .pill .ic{ display:inline-flex; align-items:center; }
  .pill .ic svg{ width:22px; height:22px; color:var(--brand); }
  .pill .lab{ line-height:1.1; white-space:nowrap; }
  .pill .arw{ display:none; }
  .pill:active{ background:var(--tan); }

  .block{ border-top:2px solid var(--brand); margin:34px -36px 0; padding:32px 36px 0; }
  .block > h2{ text-align:center; font-size:26px; font-weight:700; margin:0 0 20px; }
  .note{ font-size:13.5px; color:#6f675a; line-height:1.7; }
  #trashCards{ display:flex; flex-direction:column; gap:12px; }
  .trashRow{ display:flex; align-items:center; gap:12px; border:1.5px solid var(--brand); border-radius:16px; padding:14px 16px; background:var(--tan); }
  .trashRow .lab{ flex:0 0 92px; font-weight:800; font-size:14px; color:var(--brand); line-height:1.2; }
  .trashRow .lab small{ display:block; font-size:9px; color:var(--sub); font-weight:700; letter-spacing:.06em; margin-top:2px; }
  .trashRow .arw2{ color:var(--brand); font-weight:800; font-size:18px; flex:0 0 auto; }
  .trashRow .tg{ flex:1; text-align:left; font-size:12.5px; color:#2e3a39; line-height:1.4; font-weight:700; }
  .trashRow .tg em{ display:block; font-style:normal; font-weight:500; font-size:10.5px; color:var(--sub); margin-top:3px; line-height:1.35; }
  .chips{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
  .chip{ background:var(--tan); color:#6b5f42; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; }
  .kvbox{ background:var(--tan); border:1.5px solid var(--brand); border-radius:12px; padding:6px 16px; margin-bottom:14px; }
  .kv{ display:flex; justify-content:space-between; padding:11px 0; border-top:1px solid var(--hair); font-size:14px; }
  .kv:first-child{ border-top:none; }
  .kv b{ color:var(--sub); font-weight:700; }

  .cats{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
  .catbtn{ background:none; border:none; font-size:13px; font-weight:700; color:var(--sub); padding:4px 2px; cursor:pointer; letter-spacing:.02em; }
  .catbtn.on{ color:var(--ink); border-bottom:2px solid var(--ink); }

  .cards{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px 12px; }
  @media (max-width:440px){ .cards{ grid-template-columns:1fr 1fr; } }
  .place{ text-align:center; }
  .arch{ width:100%; aspect-ratio:3/4; border-radius:48% 48% 12px 12px / 40% 40% 12px 12px; border:1.5px solid var(--brand); display:flex; align-items:center; justify-content:center; font-size:34px; overflow:hidden; background-size:cover; background-position:center; }
  .place .nm{ font-weight:800; font-size:11.5px; margin:8px 0 2px; letter-spacing:.02em; }
  .place .ds{ font-size:10px; color:var(--sub); line-height:1.35; min-height:26px; }
  .place .go{ display:inline-block; font-size:10px; font-weight:800; color:var(--ink); text-decoration:underline; text-underline-offset:2px; margin-top:5px; }

  .mapbtn{ display:block; text-align:center; border:1.5px solid var(--line); color:var(--ink); text-decoration:none; font-weight:700; padding:14px; border-radius:999px; margin-top:20px; font-size:14px; }
  .dirHint{ text-align:center; font-size:12px; color:var(--sub); font-weight:800; margin-top:18px; }
  .dirbtns{ display:flex; gap:8px; margin-top:8px; }
  .dirbtns a{ flex:1; text-align:center; text-decoration:none; font-weight:800; font-size:13.5px; padding:13px 6px; border-radius:12px; }
  iframe{ width:100%; height:340px; border:1px solid var(--hair); border-radius:12px; }

  .field{ width:100%; border:1px solid var(--hair); background:var(--paper); border-radius:10px; padding:13px; font-size:15px; margin-bottom:10px; font-family:inherit; }
  .consent{ display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--sub); margin:2px 0 14px; }
  .submit{ width:100%; background:var(--ink); color:var(--cream); border:none; font-weight:800; font-size:15px; padding:15px; border-radius:999px; cursor:pointer; }
  .ok{ background:#EAF3EC; border:1px solid #cfe6d5; color:#2f6b45; border-radius:12px; padding:14px; font-weight:800; font-size:14px; text-align:center; }
  footer{ padding:34px 0 8px; text-align:center; color:var(--sub); font-size:11px; }

  /* 📍 도착 알림 지도 (주민권 기능 — 붉은 톤) */
  #arriveShell{ position:relative; height:300px; border-radius:12px; overflow:hidden; border:1px solid var(--hair); background:#fff; }
  #arriveMap{ height:100%; }
  #arriveShell .clap{ position:absolute; left:50%; top:45%; z-index:1200; font-size:80px; pointer-events:none; opacity:0; transform:translate(-50%,-50%) scale(0); text-shadow:0 4px 12px rgba(0,0,0,.35); }
  #arriveShell .clap.show{ animation:clapPop 2.4s ease-out forwards; }
  @keyframes clapPop{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    14%{transform:translate(-50%,-58%) scale(1.35);opacity:1}
    30%{transform:translate(-50%,-50%) scale(1);opacity:1}
    50%{transform:translate(-50%,-53%) scale(1.12) rotate(-7deg);opacity:1}
    68%{transform:translate(-50%,-50%) scale(1) rotate(7deg);opacity:1}
    100%{transform:translate(-50%,-80%) scale(.85) rotate(0);opacity:0}
  }
  .amctl{ position:absolute; right:12px; z-index:1000; width:40px; height:40px; border-radius:999px; display:flex; align-items:center; justify-content:center; border:1px solid var(--hair); background:#fff; color:#374151; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.16); }
  .amctl.home{ top:12px; } .amctl.loc{ top:60px; }
  .amctl.on{ background:var(--brand); color:#fff; border-color:transparent; }
  .ambar{ margin-top:10px; display:none; align-items:center; gap:14px; padding:9px 12px; border-radius:10px; border:1px solid var(--hair); background:var(--paper); color:var(--ink); font-size:12px; font-family:'SF Mono',Menlo,Consolas,monospace; }
  .ambar .g{ color:#137a43; font-weight:700; } .ambar .a{ color:#b45309; font-weight:700; }
  #arriveBanner .ok{ margin-bottom:10px; }
  /* 진입 시 위치 동의 모달 */
  .gpsmodal{ position:fixed; inset:0; z-index:3000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.5); }
  .gpsmodal.show{ display:flex; }
  .gpsmodal .card{ width:100%; max-width:340px; background:#fff; border-radius:18px; padding:24px 22px; text-align:center; box-shadow:0 24px 60px -18px rgba(0,0,0,.45); }
  .gpsmodal .pin{ width:52px; height:52px; margin:0 auto 14px; border-radius:50%; background:var(--tan); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .gpsmodal h3{ font-size:18px; font-weight:900; margin:0 0 8px; color:var(--ink); line-height:1.4; }
  .gpsmodal .desc{ font-size:13.5px; color:var(--sub); margin:0 0 18px; line-height:1.6; }
  .gpsmodal .brow{ display:flex; gap:8px; }
  .gpsmodal .brow button{ flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
  .gpsmodal .no{ background:#f1f3f7; color:#4b5563; }
  .gpsmodal .yes{ background:var(--brand); color:#fff; }
  .gpsmodal .fine{ font-size:11px; color:#9aa1ab; margin-top:12px; }
  /* 🎉 500m 진입 환영 팝업 */
  .welcomePop{ position:fixed; inset:0; z-index:4000; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.55); }
  .welcomePop.show{ display:flex; }
  .welcomePop .wcard{ width:100%; max-width:340px; background:#fff; border-radius:22px; padding:30px 24px 24px; text-align:center; box-shadow:0 24px 60px -18px rgba(0,0,0,.5); }
  .welcomePop .wclap{ font-size:76px; line-height:1; margin-bottom:6px; display:inline-block; transform-origin:center; }
  .welcomePop.show .wclap{ animation:clapPop2 1.5s ease-out 1; }
  .welcomePop h3{ font-size:24px; font-weight:800; color:var(--brand); margin:6px 0; }
  .welcomePop p{ font-size:14px; color:var(--sub); margin:0 0 18px; line-height:1.6; }
  .welcomePop button{ width:100%; background:var(--brand); color:#fff; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }
  @keyframes clapPop2{
    0%{transform:scale(0);opacity:0}
    16%{transform:scale(1.35);opacity:1}
    34%{transform:scale(1) rotate(0)}
    52%{transform:scale(1.12) rotate(-8deg)}
    70%{transform:scale(1) rotate(8deg)}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
</style>
</head>
<body>
<div class="gpsmodal" id="gpsModal">
  <div class="card">
    <div class="pin">📍</div>
    <h3 id="gpsQ">위치를 동의하고 내 위치를 보시겠습니까?</h3>
    <p class="desc" id="gpsDesc"></p>
    <div class="brow">
      <button class="no" id="gpsNo" type="button">나중에</button>
      <button class="yes" id="gpsYes" type="button">예, 동의</button>
    </div>
    <p class="fine" id="gpsFine"></p>
  </div>
</div>

<div class="welcomePop" id="welcomePop">
  <div class="wcard">
    <div class="wclap">👏</div>
    <h3 id="wcTitle">환영합니다!</h3>
    <p id="wcSub"></p>
    <button id="wcClose" type="button">확인</button>
  </div>
</div>

<div class="wrap">
  <div class="hero"><div class="langs" id="langs"></div></div>

  <div class="content">
    <div class="welcome">
      <img class="wsym" src="hiero_logored2.png" alt="HIERO" onerror="this.style.display='none'" />
      <h1 class="title" id="title" style="font-weight:500;letter-spacing:.01em;font-size:27px;color:var(--brand)">Welcome! Guest Guide</h1>
    </div>

    <div class="infoCard split">
      <div><span class="lbl" id="lblCheckin">CHECK-IN</span><span class="val" id="checkinV">15:00</span></div>
      <div class="divider"></div>
      <div><span class="lbl" id="lblCheckout">CHECK-OUT</span><span class="val" id="checkoutV">11:00</span></div>
    </div>

    <div class="infoCard">
      <div class="row"><span class="lbl" id="lblWifi">WIFI NETWORK</span><span class="val sm" id="wifiName">—</span></div>
      <div class="row"><span class="lbl" id="lblPass">PASSWORD</span><span class="val sm" id="wifiPass">—</span></div>
    </div>

    <div class="kvbox" id="roomBox" style="display:none"></div>

    <nav class="menu" id="menu">
      <a class="pill" href="#sec-directions"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="m11.54 22.351.07.04.028.016a.76.76 0 0 0 .723 0l.028-.015.071-.041a16.975 16.975 0 0 0 1.144-.742 19.58 19.58 0 0 0 2.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 0 0-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 0 0 2.682 2.282 16.975 16.975 0 0 0 1.145.742ZM12 13.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd"/></svg></span><span class="lab"></span><span class="arw">⟶</span></a>
      <a class="pill" href="#sec-local"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.223 2.25c-.497 0-.974.198-1.325.55l-1.3 1.298A3.75 3.75 0 0 0 7.5 9.75c.627.47 1.406.75 2.25.75.844 0 1.624-.28 2.25-.75.626.47 1.406.75 2.25.75.844 0 1.623-.28 2.25-.75a3.75 3.75 0 0 0 4.902-5.652l-1.3-1.299a1.875 1.875 0 0 0-1.325-.549H5.223Z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M3 20.25v-8.755c1.42.674 3.08.673 4.5 0A5.234 5.234 0 0 0 9.75 12c.804 0 1.568-.182 2.25-.506a5.234 5.234 0 0 0 2.25.506c.804 0 1.567-.182 2.25-.506 1.42.674 3.08.675 4.5.001v8.755h.75a.75.75 0 0 1 0 1.5H2.25a.75.75 0 0 1 0-1.5H3Zm3-6a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-.75.75h-3a.75.75 0 0 1-.75-.75v-3Zm8.25-.75a.75.75 0 0 0-.75.75v5.25c0 .414.336.75.75.75h3a.75.75 0 0 0 .75-.75v-5.25a.75.75 0 0 0-.75-.75h-3Z" clip-rule="evenodd"/></svg></span><span class="lab"></span><span class="arw">⟶</span></a>
      <a class="pill" href="#sec-map"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.161 2.58a1.875 1.875 0 0 1 1.678 0l4.993 2.498c.106.052.23.052.336 0l3.869-1.935A1.875 1.875 0 0 1 21.75 4.82v12.485c0 .71-.401 1.36-1.037 1.677l-4.875 2.437a1.875 1.875 0 0 1-1.676 0l-4.994-2.497a.375.375 0 0 0-.336 0l-3.868 1.935A1.875 1.875 0 0 1 2.25 19.18V6.695c0-.71.401-1.36 1.036-1.677l4.875-2.437ZM9 6a.75.75 0 0 1 .75.75V15a.75.75 0 0 1-1.5 0V6.75A.75.75 0 0 1 9 6Zm6.75 3a.75.75 0 0 0-1.5 0v8.25a.75.75 0 0 0 1.5 0V9Z" clip-rule="evenodd"/></svg></span><span class="lab"></span><span class="arw">⟶</span></a>
      <a class="pill" href="#sec-trash"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd"/></svg></span><span class="lab"></span><span class="arw">⟶</span></a>
      <a class="pill" href="#sec-guest"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-8.4 8.4a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32l8.4-8.4Z"/><path d="M5.25 5.25a3 3 0 0 0-3 3v10.5a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3V13.5a.75.75 0 0 0-1.5 0v5.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5V8.25a1.5 1.5 0 0 1 1.5-1.5h5.25a.75.75 0 0 0 0-1.5H5.25Z"/></svg></span><span class="lab"></span><span class="arw">⟶</span></a>
    </nav>

    <section id="sec-directions" class="block">
      <h2 class="serif" id="dirTitle">찾아오는 법</h2>
      <div class="kvbox">
        <div class="kv"><b id="addrLbl">주소</b><span id="addrVal">—</span></div>
        <div class="kv" id="transitRow" style="display:none"><b id="transitLbl">교통</b><span id="transitVal"></span></div>
      </div>
      <div class="note" id="transitInfo" style="white-space:pre-line;text-align:left;margin:14px 2px 0"></div>
      <div class="dirHint" id="dirHint">🧭 길찾기</div>
      <div class="dirbtns" id="dirBtns"></div>
    </section>

    <section id="sec-local" class="block">
      <h2 class="serif" id="localTitle">동네 가이드</h2>
      <p class="note" id="recIntro" style="text-align:center;margin:-8px 0 16px"></p>
      <div class="cats" id="catbtns"></div>
      <div class="cards" id="cards"></div>
    </section>

    <section id="sec-map" class="block">
      <h2 class="serif" id="h2Map">동네 지도</h2>
      <iframe id="mapFrame" title="map" allow="geolocation"></iframe>
      <a class="mapbtn" id="mapLink" href="#" target="_blank"></a>
    </section>

    <section id="sec-trash" class="block">
      <h2 class="serif" id="trashTitle">쓰레기 버리는 법</h2>
      <div id="trashCards"></div>
      <p class="note" id="trashNote" style="text-align:center;margin-top:14px"></p>

/* 네이버 이미지검색으로 가게 사진 채우기 (admin vite 프록시 /naver-api) */
const _photoCache = {};
function applyPhoto(el, url){
  if (!url || !el) return;
  const im = new Image();
  im.onload = () => { el.style.backgroundImage = `url("${url}")`; el.textContent = ""; };
  im.src = url;
}
async function loadPhoto(el, name){
  if (!name || !el) return;
  if (name in _photoCache) return applyPhoto(el, _photoCache[name]);
  _photoCache[name] = null;
  try {
    const r = await fetch("/naver-api/v1/search/image?display=1&sort=sim&query=" + encodeURIComponent(name));
    if (!r.ok) return;
    const d = await r.json();
    const it = d.items && d.items[0];
    _photoCache[name] = (it && it.thumbnail) || null;
    applyPhoto(el, _photoCache[name]);
  } catch { /* 실패시 이모지 유지 */ }
}

    const L2=[];
    const subs=((sub.result&&sub.result.station)||[]).slice(0,2).map(s=>`${s.stationName}${t.stn} — ${_wm(_hav(lat,lng,s.y,s.x))}${t.walk}`);
    if(subs.length) L2.push(`🚇 ${t.sub}\n   ${subs.join("\n   ")}`);
    const b=((bus.result&&bus.result.station)||[])[0];
    if(b) L2.push(`🚌 ${t.bus}\n   ${b.stationName} — ${_wm(_hav(lat,lng,b.y,b.x))}${t.walk}`);
    const p=((route.result&&route.result.path)||[])[0];
    if(p){
      const legs=((p.subPath)||[]).filter(s=>s.trafficType!==3).map(s=>{
        const nm=(s.lane&&s.lane[0])?(s.lane[0].busNo||s.lane[0].name||""):"";
        return `${s.trafficType===1?"🚇":"🚌"} ${nm} · ${s.startName||""} → ${s.endName||""}`;
      });
      const tot=p.info?p.info.totalTime:"";
      L2.push(`✈️ ${t.air}  (${t.taxi} 60${t.min} · ${tot}${t.min})\n   ${legs.join("\n   ")}`);
    }
    L2.push(t.note);
    box.textContent = L2.length>1 ? L2.join("\n\n") : t.note;
  }catch(e){ box.textContent=t.note; }
}

/* ── 📍 도착 알림 지도 (주민권 /map-demo 틀) ── */
const AR = L.arrive, ARRIVE_RADIUS = 500;
function havd(aLat,aLng,bLat,bLng){const R=6371000,r=x=>x*Math.PI/180;const dLat=r(bLat-aLat),dLng=r(bLng-aLng);const s=Math.sin(dLat/2)**2+Math.cos(r(aLat))*Math.cos(r(bLat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
let aWatch=null, arrived=false, ACOORD=null;
function showWelcome(name){   // 🎉 500m 진입 — 화면 중앙 박수 환영 팝업
  const pop=$("welcomePop"); if(!pop) return;
  $("wcTitle").textContent = AR.welcome;
  $("wcSub").textContent = AR.welcomeSub.replace("{name}", name||"HIERO");
  pop.classList.remove("show"); void pop.offsetWidth; pop.classList.add("show");
  clearTimeout(showWelcome._t); showWelcome._t = setTimeout(()=>pop.classList.remove("show"), 6000);
}
// 좌표가 있으면 동의 모달을 띄우고, 동의하면 백그라운드로 위치를 지켜본다(화면엔 지도·표시 없음).
function setupArrival(coord){
  if(!coord) return;                       // 좌표 없으면 조용히 감지 안 함
  ACOORD=coord;
  const modal=$("gpsModal"); modal.classList.add("show");
  $("gpsYes").onclick=()=>{ modal.classList.remove("show"); startGPS(); };
  $("gpsNo").onclick=()=>{ modal.classList.remove("show"); };
}
// 백그라운드 위치 감시 — 가이드가 열려 있는 동안만. 500m 진입 순간 환영 팝업만 띄운다.
function startGPS(){
  if(!navigator.geolocation || !window.isSecureContext) return;   // https 필요
  aWatch=navigator.geolocation.watchPosition(pos=>{
    const d=havd(pos.coords.latitude,pos.coords.longitude,ACOORD.lat,ACOORD.lng);
    if(d<=ARRIVE_RADIUS && !arrived){ arrived=true; showWelcome(ACOORD.name); }
    else if(d>ARRIVE_RADIUS && arrived){ arrived=false; }
  }, ()=>{ aWatch=null; }, { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}

/* 언어 버튼 */

/* 정적 문구 언어 적용 */
$("lblCheckin").textContent = L.checkin;

$("gcContact").placeholder = L.phContact;

$("footer").textContent = L.footer;

let POIPHOTOS = {};
Promise.all([
  fetch("rooms.json?t="+Date.now()).then(r=>r.json()),
  fetch("neighborhood_data.json?t="+Date.now()).then(r=>r.json()),
  fetch("room_coords.json?t="+Date.now()).then(r=>r.json()).catch(()=>({coords:{}})),
  fetch("room_photos.json?t="+Date.now()).then(r=>r.json()).catch(()=>({photos:{}})),
  fetch("room_times.json?t="+Date.now()).then(r=>r.json()).catch(()=>({times:{}})),
  fetch("poi_photos.json?t="+Date.now()).then(r=>r.json()).catch(()=>({photos:{}})),
  fetch("room_addresses.json?t="+Date.now()).then(r=>r.json()).catch(()=>({addresses:{}})),
]).then(([roomsDoc, nbhd, coordsDoc, photosDoc, timesDoc, poiPhotosDoc, addrDoc]) => {
  POIPHOTOS = (poiPhotosDoc && poiPhotosDoc.photos) || {};
  let room = (roomsDoc.rooms||{})[code] || { code, name:code, location:"", area:"강동구 천호동", roomType:"", bed:"", tv:"" };
  room = { ...room };
  if (pName) room.name = pName;
  if (pArea) room.area = pArea;
  if (pAddress) room.location = pAddress;
  if (pRoomType) room.roomType = pRoomType;
  const area = room.area;

  // 제목
  $("title").textContent = room.name + (pName ? "" : L.suffix);

  // 📍 도착 감지 좌표: URL ?stayLat/lng(=lat/lng) 우선, 없으면 room_coords[code]
  const rc = (coordsDoc.coords || {})[code];
  const arriveCoord = (pStayLat && pStayLng)
    ? { lat:+pStayLat, lng:+pStayLng, name:room.name }
    : (rc && rc.lat ? { lat:rc.lat, lng:rc.lng, name:room.name } : null);
  setupArrival(arriveCoord);

  // 체크인/체크아웃 — 링크값 우선, 없으면 방 설정값(room_times)
  const rt = (timesDoc.times || {})[code] || {};
  const cin = pCheckin || rt.checkin, cout = pCheckout || rt.checkout;
  if (cin) $("checkinV").textContent = cin;
  if (cout) $("checkoutV").textContent = cout;
  // WiFi — 링크(#프래그먼트)로 오면 표시, 없으면 "체크인 시 안내". 비번은 URL 평문 노출 안 함.
  $("wifiName").textContent = pWifiName || L.wifiFallback;
  $("wifiPass").textContent = pWifiPass || L.wifiFallback;

  // 방 정보 카드
  const rows = [[L.rlbl.roomType,room.roomType],[L.rlbl.bed,room.bed],[L.rlbl.tv,room.tv],[L.rlbl.bath,room.bath],[L.rlbl.fac,room.facilities]].filter(x=>x[1]);
  if (rows.length) { const rb=$("roomBox"); rb.style.display=""; rb.innerHTML = rows.map(x=>`<div class="kv"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join(""); }

  // 숙소 실사진 히어로 — ?cover= 우선, 없으면 room_photos[code]
  const roomPhoto = (photosDoc.photos || {})[code];
  const coverUrl = (pCover && isHttpUrl(pCover)) ? pCover : (roomPhoto && isHttpUrl(roomPhoto)) ? roomPhoto : null;
  if (coverUrl) {
    const hero=document.querySelector(".hero"); const img=document.createElement("img"); img.alt="";
    img.onload=()=>hero.insertBefore(img,hero.firstChild); img.onerror=()=>img.remove(); img.src=coverUrl;
  }

  // 찾아오는 법 — 주소는 숙소 도로명/지번(room_addresses), 없으면 랜드마크/지역으로 폴백
  const addr = (addrDoc.addresses || {})[code];
  $("addrVal").textContent = pAddress || addr || room.location || area;
  if (room.transport) { $("transitRow").style.display=""; $("transitVal").textContent = room.transport; }
  // 길찾기 3앱 (네이버·카카오·구글) — 좌표 있으면 목적지 좌표로 경로, 없으면 주소 검색
  (function(){
    // 목적지 이름은 숙소 이름이 아니라 주소(지번/도로명). 없으면 랜드마크→지역.
    const dest = encodeURIComponent(addr || room.location || area);
    let naver, kakao, google;
    if (arriveCoord && arriveCoord.lat && arriveCoord.lng) {
      const la = arriveCoord.lat, ln = arriveCoord.lng;
      naver  = `https://map.naver.com/p/directions/-/${ln},${la},${dest}/-/transit`;
      kakao  = `https://map.kakao.com/link/to/${dest},${la},${ln}`;
      google = `https://www.google.com/maps/dir/?api=1&destination=${la},${ln}`;
    } else {
      naver  = `https://map.naver.com/p/search/${dest}`;
      kakao  = `https://map.kakao.com/?q=${dest}`;
      google = `https://www.google.com/maps/search/?api=1&query=${dest}`;
    }
    const b = (href,label,bg,fg) => `<a href="${href}" target="_blank" rel="noopener" style="background:${bg};color:${fg}">${label}</a>`;
    $("dirBtns").innerHTML = b(naver,"네이버","#03c75a","#fff") + b(kakao,"카카오","#FEE500","#3c1e1e") + b(google,"구글","#4285F4","#fff");
  })();
  // 어쎄 찾아오는 법 — ODsay로 가까운 지하철·버스 + 인천공항 경로를 #transitInfo에 채운다
  if (arriveCoord && arriveCoord.lat && arriveCoord.lng) loadDirections(+arriveCoord.lat, +arriveCoord.lng);

  // 동네 지도 (iframe) — 숙소 좌표 전달
  let mapUrl = "neighborhood_map.html?area=" + encodeURIComponent(area);
  if (arriveCoord) mapUrl += `&stayLat=${arriveCoord.lat}&stayLng=${arriveCoord.lng}&stayName=${encodeURIComponent(room.name)}`;
  $("mapLink").href = mapUrl; $("mapFrame").src = mapUrl;

  // 동네 추천 — 숙소 2km 이내(동 단위 아님), 가까운 순. 어쎄 아치 카드 + 거리 + 지도 연동.
  const NEARBY = 2000;
  const near2k = [];
  if (arriveCoord) {
    for (const a of Object.keys(nbhd.areas || {})) for (const p of (nbhd.areas[a] || [])) {
      if (!p.lat || !p.lng) continue;
      const d = havd(arriveCoord.lat, arriveCoord.lng, p.lat, p.lng);
      if (d <= NEARBY) near2k.push({ ...p, d });
    }
    near2k.sort((x,y)=>x.d-y.d);
  }
  const distTxt = d => d < 1000 ? Math.round(d)+"m" : (d/1000).toFixed(1)+"km";
  const cbox = $("catbtns"), cardBox = $("cards");
  const useCats = (pCats.length ? CATS.filter(c=>pCats.includes(c)) : CATS).filter(c => near2k.some(p=>p.category===c));

  function render(cat){
    [...cbox.children].forEach(b => b.classList.toggle("on", b.dataset.cat === cat));
    $("localTitle").textContent = cat==="맛집" ? L.food : L.cat[cat];
    const list = near2k.filter(p => p.category === cat);
    cardBox.innerHTML = list.map((p,i) => {
      const c = COLORS[cat]||"#8a7a5a";
      return `<div class="place" data-i="${i}" style="cursor:pointer">
        <div class="arch" style="background:${c}1F;color:${c}">${ICONS[cat]||"📍"}</div>
        <div class="nm">${esc(p.name||"")}</div>
        <div class="ds">${esc(p.naverCategory||"")} · ${distTxt(p.d)}</div>
      </div>`;
    }).join("") || `<div class="note" style="grid-column:1/-1;text-align:center">—</div>`;
    const archEls = cardBox.querySelectorAll(".arch");
    list.forEach((p,i) => { const u = POIPHOTOS[p.name]; if (u) applyPhoto(archEls[i], u); else loadPhoto(archEls[i], p.name); });
    cardBox.querySelectorAll(".place").forEach(el => {
      el.addEventListener("click", () => {
        const p = list[+el.dataset.i]; const mf = $("mapFrame");
        if (mf && mf.contentWindow) mf.contentWindow.postMessage({ type:"hieroFocus", lat:p.lat, lng:p.lng, name:p.name, cat:p.category, extra:p.naverCategory||p.address||"" }, "*");
        if (mf) mf.scrollIntoView({ behavior:"smooth", block:"center" });
      });
    });
  }

  if (!near2k.length) {
    $("recIntro").textContent = L.recEmpty;
    cbox.style.display = "none"; cardBox.innerHTML = "";
  } else {
    $("recIntro").textContent = L.rec2.replace("{n}", near2k.length);
    cbox.style.display = "flex"; cbox.innerHTML = "";
    useCats.forEach(c => {
      const b = document.createElement("button");
      b.className = "catbtn"; b.dataset.cat = c; b.textContent = L.cat[c];
      b.onclick = () => render(c);
      cbox.appendChild(b);
    });
    render(useCats[0] || "맛집");
  }
}).catch(() => { $("title").textContent = "데이터를 불러오지 못했어요"; });

$("gcSubmit").onclick = () => {   // 정적 데모 — 실제 전송 없음
  const name = $("gcName").value.trim(); const contact = $("gcContact").value.trim();
  const res = $("gcResult");
  if (!name || !contact) { res.innerHTML = `<div class="note" style="color:#c0392b">${esc(L.needBoth)}</div>`; return; }
  $("gcForm").innerHTML = `<div class="ok">${esc(L.ok)} (데모)</div>`;
};
